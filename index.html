<html>
    <head>
        <title>Fangan Maker</title>
        <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self';">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <link rel="icon" type="icon/ico" href="assets/icon/FanganMakerIcon.ico">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="mainBox">
            <div class="visibleBox">
                <div class="title">
                    <img src="assets/icon/FanganMakerIcon.ico" width="150px" height="150px" class="logoImage">
                    <h1>>fangan maker</h1>
                    <p>a tool that allows for the creation of fanganronpas in rpg maker mv and rpg maker mz without the need to code.</p>
                    <button id="button" class="button">
                        <img src="assets/icon/Documentation.svg" width="15px" height="15px" class="icon">
                        documentation
                    </button>
                    <br><br>
                    <button id="games" class="button">
                        <img src="assets/icon/Game.svg" width="15px" height="15px" class="icon">
                        games that use fangan maker
                    </button>
                </div>

                <div class="downloads">
                    <h2>>download fangan maker</h2>
                    <button id="itchio" class="button">
                        <img src="assets/icon/itchio.svg" width="15px" height="15px" class="icon">
                        itch.io
                    </button>
                    <br><br>
                    <button id="gamejolt" class="button">
                        <img src="assets/icon/Gamejolt.svg" width="15px" height="15px" class="icon">
                        gamejolt
                    </button>
                </div>

                <div class="socialMedia">
                    <h2>>social media</h2>
                    <button id="discord" class="iconButton">
                        <img src="assets/icon/Discord.svg" width="25px" height="25px" class="icon">
                    </button>
                    <button id="twitter" class="iconButton">
                        <img src="assets/icon/Twitter.svg" width="25px" height="25px" class="icon">
                    </button>
                    <button id="youtube" class="iconButton">
                        <img src="assets/icon/Youtube.svg" width="25px" height="25px" class="icon">
                    </button>
                </div>
            </div>
        </div>
        
        <script src ="script.js"></script>
    </body>
</html>
